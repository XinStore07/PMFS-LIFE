<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Book — 8 Week Program</title>
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#161616;
    --surface-2:#1f1f1f;
    --ink:#f2f2f0;
    --ink-dim:#8a8a86;
    --accent:#f2f2f0;
    --accent-dim:#c4c4c0;
    --good:#f2f2f0;
    --bad:#6a6a66;
    --border:rgba(242,242,240,0.12);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --purple:#8b5cf6;
    --purple-dim:#b39ddb;
    --purple-soft:rgba(139,92,246,0.14);
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  .bg-layer{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 800px 500px at 15% -5%, rgba(255,255,255,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse 900px 700px at 50% 120%, rgba(255,255,255,0.04), transparent 60%),
      var(--bg);
  }
  .bg-layer::before{
    content:'';
    position:absolute; inset:-50%;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:46px 46px;
    animation:driftGrid 40s linear infinite;
  }
  .bg-layer::after{
    content:'';
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:5px 5px;
    opacity:0.5;
  }
  @keyframes driftGrid{ 0%{transform:translate(0,0);} 100%{transform:translate(46px,46px);} }
  .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand h1{
    font-size:22px;letter-spacing:-0.5px;text-transform:uppercase;font-weight:800;
    font-stretch:condensed; margin:0;
  }
  .brand h1 span{color:var(--accent);}
  .brand .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:right;}

  .phase-banner{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:6px;font-size:13px;color:var(--ink-dim);margin-bottom:16px;
  }
  .phase-banner b{color:var(--accent);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{
    flex:1;text-align:center;padding:9px 0;border-radius:6px;font-size:12px;
    text-transform:uppercase;letter-spacing:0.06em;font-weight:700;
    background:var(--surface);color:var(--ink-dim);cursor:pointer;border:1px solid var(--border);
  }
  .tab.active{background:var(--accent);color:#1c1b1a;border-color:var(--accent);}
  #app.theme-mental .tab.active{color:#fff;}
  #app.theme-financial .tab.active{color:#fff;}
  #app.theme-spiritual .tab.active{color:#fff;}
  #app.theme-mental{ --accent:#ef4444; --accent-dim:#f87171; --good:#ef4444; }
  #app.theme-financial{ --accent:#3b82f6; --accent-dim:#60a5fa; --good:#3b82f6; }
  #app.theme-spiritual{ --accent:#22c55e; --accent-dim:#4ade80; --good:#22c55e; }
  #app.theme-general{ --accent:#8b5cf6; --accent-dim:#b39ddb; --good:#8b5cf6; }
  .tab.tab-general{background:var(--purple-soft);color:var(--purple-dim);border-color:rgba(139,92,246,0.35);font-weight:800;}
  .tab.tab-general.active{background:var(--purple);color:#fff;border-color:var(--purple);}

  .gen-card{border-color:rgba(139,92,246,0.28);}
  .gen-grid{display:flex;flex-direction:column;gap:6px;}
  .gen-row{display:grid;gap:6px;align-items:center;}
  .gen-row-label{font-family:var(--mono);font-size:11px;color:var(--purple-dim);font-weight:700;text-align:center;}
  .gen-day-label{font-family:var(--mono);font-size:9px;color:var(--ink-dim);text-align:center;text-transform:uppercase;}
  .gen-cell{
    aspect-ratio:1;max-height:26px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }
  .gen-chart-box{max-width:280px;margin:0 auto;background:var(--surface-2);border-radius:8px;padding:10px 8px 4px;}
  .gen-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
  .gen-legend-item{font-size:11px;color:var(--ink-dim);font-family:var(--mono);display:flex;align-items:center;gap:5px;}
  .gen-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .gen-section{padding:14px 0;border-top:1px solid var(--border);}
  .gen-section:first-child{border-top:none;padding-top:0;}
  .gen-mini-stats{display:flex;gap:10px;margin-bottom:10px;}
  .gen-mini-stat{flex:1;text-align:center;background:var(--surface-2);border-radius:7px;padding:8px 4px;}
  .gen-mini-stat .num{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--purple-dim);}
  .gen-mini-stat .lbl{font-size:9px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .qc-card{padding-bottom:14px;}
  .qc-row{display:flex;gap:8px;flex-wrap:wrap;}
  .qc-btn{
    flex:1;min-width:70px;background:var(--surface-2);border:2px solid var(--qc-color, var(--border));
    color:var(--qc-color, var(--ink));padding:10px 6px;border-radius:8px;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .qc-btn.done{background:var(--qc-color);color:#0a0a0a;}
  .qc-streak{font-size:10px;opacity:.85;font-family:var(--mono);text-transform:none;letter-spacing:0;}
  .qc-rest{
    flex:1;min-width:70px;background:var(--surface-2);border:2px dashed var(--border);color:var(--ink-dim);
    padding:10px 6px;border-radius:8px;font-size:11px;text-align:center;display:flex;align-items:center;justify-content:center;
    text-transform:uppercase;letter-spacing:.03em;font-weight:700;
  }

  .nudge-card{position:relative;}
  .nudge-dismiss{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:14px;}
  .nudge-msg{font-size:13px;color:var(--ink-dim);margin-bottom:10px;line-height:1.5;}
  .nudge-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .nudge-btn{background:var(--purple);color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}

  .hm-weeklabel{font-family:var(--mono);font-size:10px;color:var(--purple-dim);margin:10px 0 5px;text-transform:uppercase;}
  .hm-weeklabel:first-child{margin-top:0;}
  .hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .hm-cell{
    aspect-ratio:1;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:3px;
  }
  .hm-cell.future{opacity:.25;}
  .hm-cell.today{border-color:var(--purple);border-width:2px;}
  .hm-cell.perfect{box-shadow:0 0 7px 1px rgba(139,92,246,0.75);border-color:var(--purple);}
  .hm-dot{width:6px;height:6px;border-radius:50%;border:1.4px solid;box-sizing:border-box;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
  .day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .day-head h2{font-size:19px;margin:0;text-transform:uppercase;letter-spacing:-0.3px;}
  .day-head .badge{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .why{font-size:13px;color:var(--ink-dim);margin:2px 0 14px;}

  .rest-card{text-align:center;padding:40px 16px;}
  .rest-card .chalk{font-size:40px;margin-bottom:8px;}
  .rest-card p{color:var(--ink-dim);font-size:14px;}

  .ex{border-top:1px solid var(--border);padding:14px 0;}
  .ex:first-of-type{border-top:none;padding-top:0;}
  .ex-top{display:flex;justify-content:space-between;align-items:baseline;}
  .ex-name{font-weight:700;font-size:15px;}
  .ex-target{font-family:var(--mono);font-size:12px;color:var(--accent);}
  .ex-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .ex-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  .ex-row input[type=number]{
    width:78px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    padding:8px;border-radius:6px;font-family:var(--mono);font-size:14px;
  }
  .unit{font-size:12px;color:var(--ink-dim);}
  .feel-btns{display:flex;gap:5px;}
  .feel{
    font-size:11px;padding:7px 9px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--ink-dim);cursor:pointer;
  }
  .feel.sel-easy.on{background:#f2f2f0;color:#0a0a0a;border-color:#f2f2f0;}
  .feel.sel-justright.on{background:transparent;color:var(--ink);border-color:var(--ink);border-width:2px;}
  .feel.sel-hard.on{background:#3a3a38;color:var(--ink-dim);border-color:var(--ink-dim);border-style:dashed;}
  .log-btn{
    margin-left:auto;background:var(--accent);color:#1c1b1a;border:none;
    padding:8px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .log-btn:disabled{opacity:.4;cursor:default;}
  .logged-tag{font-size:12px;color:var(--good);font-family:var(--mono);}
  .suggestion{font-size:12px;color:var(--ink-dim);margin-top:6px;}
  .suggestion b{color:var(--accent);}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .gcell{
    aspect-ratio:1;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    position:relative;
  }
  .gcell.today{border-color:var(--accent);border-width:2px;}
  .gcell.future{opacity:0.35;cursor:default;}
  .gcell .dlabel{font-size:9px;color:var(--ink-dim);text-transform:uppercase;font-family:var(--mono);}
  .gcell .mark{font-size:16px;margin-top:2px;}
  .weeklabel{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin:14px 0 6px;text-transform:uppercase;}

  .start-screen{text-align:center;padding:60px 20px;}
  .start-screen h1{font-size:26px;text-transform:uppercase;margin-bottom:10px;}
  .start-screen p{color:var(--ink-dim);font-size:14px;max-width:400px;margin:0 auto 24px;}
  .start-btn{
    background:var(--accent);color:#1c1b1a;border:none;padding:14px 26px;border-radius:8px;
    font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
  }
  .footer-actions{text-align:center;margin-top:22px;}
  .reset{background:none;border:none;color:var(--ink-dim);font-size:11px;text-decoration:underline;cursor:pointer;}
  .loading{text-align:center;color:var(--ink-dim);padding:40px;font-family:var(--mono);font-size:13px;}

  .ex-body{display:flex;gap:12px;align-items:flex-start;}
  .video-box{
    flex-shrink:0;width:100px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;
  }
  .video-embed{position:relative;width:100%;aspect-ratio:9/16;background:#000;}
  .video-embed.yt, .video-embed.vm{aspect-ratio:16/9;}
  .video-embed iframe, .video-embed video{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .video-placeholder{padding:8px;text-align:center;}
  .video-placeholder input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);
    padding:6px;border-radius:5px;font-size:11px;margin-bottom:6px;
  }
  .video-placeholder button{
    width:100%;background:var(--accent);color:#1c1b1a;border:none;padding:6px;
    border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;
  }
  .video-or{font-size:9px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;margin:6px 0;}
  .video-upload-btn{
    display:block;width:100%;background:var(--bg);border:1px dashed var(--border);color:var(--ink-dim);
    padding:6px 4px;border-radius:5px;font-size:10px;cursor:pointer;text-align:center;box-sizing:border-box;
  }
  .video-upload-btn:hover{border-color:var(--accent);color:var(--accent);}
  .video-change{font-size:10px;color:var(--ink-dim);text-decoration:underline;cursor:pointer;text-align:center;padding:4px;background:none;border:none;width:100%;}
  .cue{font-size:12px;color:var(--ink-dim);margin-top:2px;font-style:italic;}
  .start-weight{font-size:13px;color:var(--accent);font-family:var(--mono);margin-top:2px;}
  .bw-input{margin:16px 0;}
  .bw-input label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .bw-input input{
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink);padding:10px;
    border-radius:6px;font-family:var(--mono);font-size:14px;width:140px;text-align:center;
  }
  .skip-link{display:block;margin-top:10px;font-size:12px;color:var(--ink-dim);text-decoration:underline;cursor:pointer;background:none;border:none;}

  .ex-remove{background:none;border:none;color:var(--ink-dim);font-size:16px;cursor:pointer;line-height:1;padding:0 2px;}
  .ex-remove:hover{color:var(--bad);}
  .add-ex-btn{
    width:100%;margin-top:12px;background:none;border:1px dashed var(--border);color:var(--ink-dim);
    padding:10px;border-radius:8px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  }
  .add-ex-form{
    margin-top:12px;padding:12px;background:var(--surface-2);border-radius:8px;display:none;
  }
  .add-ex-form.open{display:block;}
  .add-ex-form input, .add-ex-form select{
    background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:8px;
    border-radius:6px;font-size:13px;margin-bottom:8px;width:100%;
  }
  .add-ex-form .row2{display:flex;gap:8px;}
  .add-ex-form .row2 input, .add-ex-form .row2 select{width:auto;flex:1;}
  .add-ex-form .actions{display:flex;gap:8px;margin-top:4px;}
  .add-ex-form .actions button{flex:1;padding:8px;border-radius:6px;border:none;font-weight:700;font-size:12px;cursor:pointer;}
  .add-ex-form .actions .save{background:var(--accent);color:#1c1b1a;}
  .add-ex-form .actions .cancel{background:var(--surface);color:var(--ink-dim);border:1px solid var(--border);}

  .quote-card{
    background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--border); border-radius:12px; padding:22px 20px;margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .quote-card::before{
    content:'"'; position:absolute; top:-30px; left:8px; font-size:140px; font-family:Georgia,serif;
    color:rgba(242,242,240,0.06); line-height:1;
  }
  .quote-text{font-size:16px;font-style:italic;line-height:1.5;position:relative;z-index:1;}
  .quote-author{font-size:11px;color:var(--ink-dim);margin-top:10px;text-transform:uppercase;letter-spacing:.08em;position:relative;z-index:1;}

  .sched-list{list-style:none;margin:0;padding:0;}
  .sched-list li{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-top:1px solid var(--border);font-size:13px;
  }
  .sched-list li:first-child{border-top:none;}
  .sched-list .d{color:var(--ink-dim);text-transform:uppercase;font-size:11px;font-family:var(--mono);width:44px;}
  .sched-list .g{flex:1;text-align:right;}
  .sched-list li.today-row{color:var(--ink);font-weight:700;}
  .sched-list li.today-row .d{color:var(--ink);}
  .sched-list li.today-row::after{content:'●';margin-left:8px;font-size:8px;}

  .weight-log-row{display:flex;gap:8px;margin-bottom:14px;}
  .weight-log-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    padding:10px;border-radius:6px;font-family:var(--mono);font-size:14px;
  }
  .weight-log-row button{
    background:var(--accent);color:#0a0a0a;border:none;padding:10px 16px;border-radius:6px;
    font-weight:700;font-size:12px;cursor:pointer;text-transform:uppercase;
  }
  .weight-stats{display:flex;gap:16px;margin-bottom:14px;}
  .wstat{flex:1;text-align:center;background:var(--surface-2);border-radius:8px;padding:12px 6px;}
  .wstat .num{font-family:var(--mono);font-size:20px;font-weight:700;}
  .wstat .lbl{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .chart-empty{text-align:center;color:var(--ink-dim);font-size:12px;padding:30px 0;}

  .todo-add{display:flex;gap:8px;margin-bottom:12px;}
  .todo-add input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    padding:10px;border-radius:6px;font-size:13px;
  }
  .todo-add button{
    background:var(--accent);color:#0a0a0a;border:none;padding:10px 16px;border-radius:6px;
    font-weight:700;cursor:pointer;font-size:14px;
  }
  .todo-list{list-style:none;margin:0;padding:0;}
  .todo-item{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;
  }
  .todo-item:first-child{border-top:none;}
  .todo-item.done .todo-label{text-decoration:line-through;color:var(--ink-dim);}
  .todo-check{
    width:18px;height:18px;border:1.5px solid var(--ink-dim);border-radius:4px;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .todo-item.done .todo-check{background:var(--accent);color:#0a0a0a;border-color:var(--accent);}
  .todo-label{flex:1;cursor:pointer;}
  .todo-del{background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:15px;}
  .todo-empty{color:var(--ink-dim);font-size:12px;text-align:center;padding:16px 0;}
  .todo-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;}
  .todo-time{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--surface-2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;}
  .todo-note{font-size:11px;color:var(--ink-dim);font-style:italic;}
  .todo-origin{font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding:2px 6px;border-radius:4px;background:var(--purple-soft);color:var(--purple-dim);}
  .todo-add-extra{display:flex;gap:8px;margin-bottom:10px;}
  .todo-add-extra input[type=time]{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);padding:8px;border-radius:6px;font-family:var(--mono);font-size:12px;}
  .todo-add-extra input[type=text]{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);padding:8px;border-radius:6px;font-size:12px;}

  .section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);
    margin:0 0 12px;font-weight:700;
  }

  .toast-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .toast-box{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 26px;
    text-align:center;max-width:340px;
  }
  .toast-box .big{font-size:15px;line-height:1.5;margin-bottom:18px;}
  .toast-box button{
    background:var(--accent);color:#0a0a0a;border:none;padding:10px 24px;border-radius:8px;
    font-weight:700;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:.05em;
  }

  .fav-star{background:none;border:none;color:var(--ink-dim);font-size:15px;cursor:pointer;padding:0;margin-right:2px;vertical-align:middle;}
  .fav-star.on{color:var(--ink);}

  .badges-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px;}
  .badge-tile{text-align:center;padding:10px 4px;border-radius:8px;border:1px solid var(--border);opacity:0.35;}

const memStore = {};
let useMemory = false;

function hasRealStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
function hasLocalStorage(){
  try{
    const t = '__test__';
    localStorage.setItem(t,'1'); localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

async function getVal(key){
  if(hasRealStorage() && !useMemory){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    const v = localStorage.getItem('logbook:'+key);
    return v ? JSON.parse(v) : null;
  }
  return Object.prototype.hasOwnProperty.call(memStore,key) ? memStore[key] : null;
}
async function setVal(key, val){
  if(hasRealStorage() && !useMemory){
    try{ await window.storage.set(key, JSON.stringify(val), false); return; }
    catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    localStorage.setItem('logbook:'+key, JSON.stringify(val));
    return;
  }
  memStore[key] = val;
}
async function listPrefix(prefix){
  if(hasRealStorage() && !useMemory){
    try{
      const r = await window.storage.list(prefix, false);
      if(r) return r.keys;
    }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('logbook:'+prefix)) out.push(k.slice('logbook:'.length));
    }
    return out;
  }
  return Object.keys(memStore).filter(k=>k.startsWith(prefix));
}
async function deleteVal(key){
  if(hasRealStorage() && !useMemory){
    try{ await window.storage.delete(key, false); return; }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){ localStorage.removeItem('logbook:'+key); return; }
  delete memStore[key];
}

// ── Shared storage (visible across every visitor, every device) ─────────
// Same shape as getVal/setVal/listPrefix but passes shared=true so the
// data is pooled globally instead of being scoped to one browser.
async function getShared(key){
  if(hasRealStorage() && !useMemory){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    const v = localStorage.getItem('logbook:shared:'+key);
    return v ? JSON.parse(v) : null;
  }
  const k = 'shared:'+key;
  return Object.prototype.hasOwnProperty.call(memStore,k) ? memStore[k] : null;
}
async function setShared(key, val){
  if(hasRealStorage() && !useMemory){
    try{ await window.storage.set(key, JSON.stringify(val), true); return; }
    catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    localStorage.setItem('logbook:shared:'+key, JSON.stringify(val));
    return;
  }
  memStore['shared:'+key] = val;
}
async function listShared(prefix){
  if(hasRealStorage() && !useMemory){
    try{
      const r = await window.storage.list(prefix, true);
      if(r) return r.keys;
    }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('logbook:shared:'+prefix)) out.push(k.slice('logbook:shared:'.length));
    }
    return out;
  }
  return Object.keys(memStore).filter(k=>k.startsWith('shared:'+prefix)).map(k=>k.slice('shared:'.length));
}
async function deleteShared(key){
  if(hasRealStorage() && !useMemory){
    try{ await window.storage.delete(key, true); return; }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){ localStorage.removeItem('logbook:shared:'+key); return; }
  delete memStore['shared:'+key];
}

// ── Who's using it right now (live, cross-device counter) ───────────────
const PRESENCE_TTL_MS = 45000;   // a visitor counts as "online" if seen in the last 45s
const HEARTBEAT_MS = 20000;      // how often this tab re-announces itself
let myUserId = null;
let welcomeBackInfo = null;      // computed once per load, shown in the profile card

function genUserId(){ return 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

async function ensureUserId(){
  if(myUserId) return myUserId;
  let id = await getVal('user:id');
  if(!id){ id = genUserId(); await setVal('user:id', id); }
  myUserId = id;
  return id;
}
async function getMyProfile(){ return await getVal('profile:me'); }

async function sendHeartbeat(){
  try{
    const id = await ensureUserId();
    await setShared('presence:'+id, Date.now());
  }catch(e){ /* best effort */ }
}

async function computeUserCounts(){
  const [memberKeys, presenceKeys] = await Promise.all([listShared('member:'), listShared('presence:')]);
  const total = memberKeys.length;
  const now = Date.now();
  const checks = presenceKeys.slice(0, 60).map(async k => {
    const ts = await getShared(k);
    return (typeof ts === 'number' && now - ts < PRESENCE_TTL_MS) ? 1 : 0;
  });
  const results = await Promise.all(checks);
  const active = Math.max(1, results.reduce((a,b)=>a+b,0)); // you're always at least 1
  return { total: Math.max(total,1), active };
}

async function refreshUserCounter(){
  const el = document.getElementById('user-counter');
  if(!el) return;
  try{
    const { total, active } = await computeUserCounts();
    el.innerHTML = `<span class="uc-dot"></span><b>${active}</b> online now · <b>${total}</b> member${total===1?'':'s'} total`;
  }catch(e){ /* silent — non-critical UI */ }
}

let counterIntervalStarted = false;
function startLiveCounter(){
  refreshUserCounter();
  sendHeartbeat();
  if(counterIntervalStarted) return;
  counterIntervalStarted = true;
  setInterval(sendHeartbeat, HEARTBEAT_MS);
  setInterval(refreshUserCounter, 8000);
  window.addEventListener('beforeunload', () => {
    if(myUserId) deleteShared('presence:'+myUserId);
  });
}

// snapshot saved on the previous visit, then updates that snapshot.
async function prepareWelcomeBack(profile){
  const prevSnap = await getVal('profile:snapshot');
  let streak = 0, totalSessions = 0;
  const start = await getStart();
  if(start){
    const todayIdx = dayIndexFor(start, new Date());
    ({ streak, totalSessions } = await computeStreakStats(start, todayIdx));
  }
  const nowSnap = { weight: profile.weight ?? null, totalSessions, streak, lastSeen: Date.now() };
  let info = null;
  if(prevSnap){
    const daysSince = Math.max(0, Math.round((nowSnap.lastSeen - (prevSnap.lastSeen||nowSnap.lastSeen)) / 86400000));
    const weightDelta = (typeof nowSnap.weight === 'number' && typeof prevSnap.weight === 'number')
      ? Math.round((nowSnap.weight - prevSnap.weight) * 10) / 10 : null;
    const sessionsDelta = totalSessions - (prevSnap.totalSessions || 0);
    info = { daysSince, weightDelta, sessionsDelta, streak };
  }
  await setVal('profile:snapshot', nowSnap);
  return info;
}

function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function isoDay(d){ return dateOnly(d).toISOString().slice(0,10); }

async function getStart(){
  const v = await getVal('program:start');
  return v ? new Date(v) : null;
}

function dayIndexFor(start, date){
  return Math.round((dateOnly(date) - dateOnly(start)) / DAY_MS);
}

function roundHalf(n){ return Math.round(n*2)/2; }

function computeStartWeight(exercise, bodyweight){
  if(!exercise.startW) return null;
  const { ratio, fallback } = exercise.startW;
  if(bodyweight && ratio){
    return roundHalf(Math.max(bodyweight * ratio, 2));
  }
  return fallback;
}

function getEmbedHtml(url){
  if(url && url.startsWith('data:video')){
    // Locally uploaded video file, stored as a data URL.
    return `<div class="video-embed"><video src="${url}" controls playsinline></video></div>`;
  }
  try{
    const u = new URL(url);
    const host = u.hostname.replace('www.','');
    if(host === 'youtube.com' || host === 'youtu.be' || host === 'm.youtube.com'){
      let vid = '';
      if(host === 'youtu.be') vid = u.pathname.slice(1);
      else if(u.searchParams.get('v')) vid = u.searchParams.get('v');
      else if(u.pathname.includes('/shorts/')) vid = u.pathname.split('/shorts/')[1];
      else if(u.pathname.includes('/embed/')) vid = u.pathname.split('/embed/')[1];
      vid = (vid||'').split('&')[0].split('?')[0];
      if(vid) return `<div class="video-embed yt"><iframe src="https://www.youtube.com/embed/${vid}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    }
    if(host === 'tiktok.com' || host === 'vm.tiktok.com' || host === 'vt.tiktok.com'){
      const vidMatch = url.match(/\/video\/(\d+)/);
      const vid = vidMatch ? vidMatch[1] : '';
      if(vid){
        // Direct iframe embed — no external script needed, so it actually loads and nothing can hijack a click.
        return `<div class="video-embed tt"><iframe src="https://www.tiktok.com/embed/v2/${vid}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
      }
      // Short links (vm.tiktok.com/vt.tiktok.com) don't carry the numeric video id, so a true embed isn't possible — just link out.
      return `<div class="video-placeholder"><a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;">Open on TikTok ↗</a><div style="color:var(--ink-dim);font-size:10px;margin-top:4px;">Short links can't be embedded — paste the full tiktok.com/@user/video/… link to embed it here.</div></div>`;
    }
    if(host === 'vimeo.com'){
      const vid = u.pathname.split('/').filter(Boolean)[0];
      if(vid) return `<div class="video-embed vm"><iframe src="https://player.vimeo.com/video/${vid}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    }
    if(host === 'instagram.com'){
      return `<div class="video-embed ig"><iframe src="${url.replace(/\/$/,'')}/embed" allowfullscreen loading="lazy"></iframe></div>`;
    }
    if(/\.(mp4|webm|mov)$/i.test(u.pathname)){
      return `<div class="video-embed"><video src="${url}" controls playsinline></video></div>`;
    }
    return `<div class="video-placeholder"><a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;">Open video ↗</a></div>`;
  }catch(e){
    return `<div class="video-placeholder" style="color:var(--bad);font-size:11px;">Invalid link</div>`;
  }
}
function suggestNext(exercise, lastLog, phase){
  if(!lastLog) return null;
  if(exercise.track === 'weight'){
    let w = lastLog.value;
    if(lastLog.feel === 'easy'){
      let inc = exercise.cat === 'isolation' ? 1.25 : (exercise.lower ? 5 : 2.5);
      if(phase === 'adaptation') inc = inc/2;
      return { text: `Aim for ${roundHalf(w+inc)}kg`, value: roundHalf(w+inc) };
    }
    if(lastLog.feel === 'justright'){
      return { text: `Same weight (${w}kg), try 1 more rep`, value: w };
    }
    return { text: `Drop slightly to ${roundHalf(Math.max(w-(exercise.lower?5:2.5),0))}kg`, value: roundHalf(Math.max(w-(exercise.lower?5:2.5),0)) };
  }
  if(exercise.track === 'reps'){
    let r = lastLog.value;
    if(lastLog.feel === 'easy') return { text: `Aim for ${r+1} reps`, value: r+1 };
    if(lastLog.feel === 'justright') return { text: `Match ${r} reps, cleaner form`, value: r };
    return { text: `Aim for ${Math.max(r-1,1)} solid reps`, value: Math.max(r-1,1) };
  }
  if(exercise.track === 'time'){
    let s = lastLog.value;
    if(lastLog.feel === 'easy') return { text: `Hold ${s+10}s`, value: s+10 };
    return { text: `Match ${s}s`, value: s };
  }
  return null;
}

async function computeStreakStats(start, todayIdx){
  const keys = await listPrefix('attendance:');
  const records = [];
  for(const k of keys){
    const idx = parseInt(k.split(':').pop(), 10);
    const v = await getVal(k);
    if(v) records.push({ idx, went: v.went });
  }
  const totalSessions = records.filter(r => r.went).length;
  let streak = 0;
  let idx = todayIdx;
  while(idx >= 0){
    const date = new Date(start.getTime() + idx*DAY_MS);
    if(date.getDay() === 0){ idx--; continue; }
    const rec = records.find(r => r.idx === idx);
    if(rec && rec.went){ streak++; idx--; }
    else if(rec && !rec.went){ break; }
    else if(idx === todayIdx){ idx--; continue; }
    else break;
  }
  return { streak, totalSessions };
}

async function getAllExercisesById(){
  const map = {};
  for(const key of Object.keys(PROGRAM)){
    for(const ex of PROGRAM[key].exercises) map[ex.id] = ex;
  }
  for(const dk of ['mon','tue','wed','thu','fri','sat']){
    const custom = (await getVal(`customex:${dk}`)) || [];
    for(const ex of custom) map[ex.id] = ex;
  }
  return map;
}

async function findLastLog(exerciseId, beforeDayIndex){
  const keys = await listPrefix(`exlog:${exerciseId}:`);
  let best = null, bestIdx = -1;
  for(const k of keys){
    const idx = parseInt(k.split(':').pop(), 10);
    if(idx < beforeDayIndex && idx > bestIdx){
      bestIdx = idx;
      const v = await getVal(k);
      if(v) best = v;
    }
  }
  return best;
}

function dateForIdx(start, idx){
  return new Date(dateOnly(start).getTime() + idx*DAY_MS);
}

async function computeWeekSessions(start, weekNum, todayIdx){
  const weekStartIdx = (weekNum-1)*7;
  let completed = 0, possible = 0;
  for(let i=0;i<7;i++){
    const dIdx = weekStartIdx+i;
    if(dIdx > todayIdx) break; // don't count days that haven't happened yet
    const date = dateForIdx(start, dIdx);
    if(dayTypeFor(date) === 0) continue; // Sunday is the scheduled rest day
    possible++;
    const att = await getVal(`attendance:${dIdx}`);
    if(att && att.went) completed++;
  }
  return { completed, possible };
}

async function renderWeeklyProgressCard(start, todayIdx){
  const profile = await getMyProfile();
  if(!profile) return '';

  const weightLog = ((await getVal('weightlog')) || []).slice().sort((a,b)=>a.week-b.week);
  const baseline = profile.weight;                                  // what they filled in when they joined
  const latestEntry = weightLog[weightLog.length-1];
  const currentWeight = latestEntry ? latestEntry.weight : baseline; // most recent weekly weigh-in

  let compareHtml = '';
  if(typeof baseline === 'number' && typeof currentWeight === 'number' && weightLog.length > 0){
    const delta = Math.round((currentWeight - baseline)*10)/10;
    compareHtml = `
      <div class="progress-compare">
        <div class="pc-item"><div class="pc-lbl">You signed up at</div><div class="pc-val">${baseline} kg</div></div>
        <div class="pc-arrow">→</div>
        <div class="pc-item"><div class="pc-lbl">Now</div><div class="pc-val">${currentWeight} kg</div></div>
        <div class="pc-delta ${delta<=0?'down':'up'}">${delta>0?'+':''}${delta} kg</div>
      </div>`;
  } else if(typeof baseline === 'number'){
    compareHtml = `<p class="why">You signed up at <b>${baseline} kg</b>. Log a weekly weigh-in below to start comparing.</p>`;
  }

  if(!start){
    return `
      <div class="card progress-card">
        <div class="day-head"><h2>Weekly Progress</h2></div>
        ${compareHtml}
        <p class="why">Start the program to begin tracking weekly progress.</p>
      </div>`;
  }

  const currentWeekNum = Math.min(Math.floor(todayIdx/7)+1, WEEKS);
  let rowsHtml = '';
  let prevWeight = null;
  for(let w=1; w<=currentWeekNum; w++){
    const entry = weightLog.find(e=>e.week===w);
    const { completed, possible } = await computeWeekSessions(start, w, todayIdx);
    const weightHtml = entry ? `${entry.weight} kg` : '<span class="wk-empty">not logged</span>';
    let deltaHtml = '';
    if(entry && prevWeight !== null){
      const d = Math.round((entry.weight - prevWeight)*10)/10;
      if(d !== 0) deltaHtml = ` <span class="wk-delta ${d<=0?'down':'up'}">${d>0?'+':''}${d}</span>`;

        <div class="wk-weight">${weightHtml}${deltaHtml}</div>

async function renderDashboard(start, todayIdx, week){
  const bodyweight = await getVal('user:bodyweight');
  const weightLog = ((await getVal('weightlog')) || []).slice().sort((a,b)=>a.week-b.week);
  const currentDow = new Date().getDay();
  const order = [1,2,3,4,5,6,0];
  const schedHtml = order.map(d=>{
    const p = PROGRAM[d];
    const isToday = d === currentDow;
    return `<li class="${isToday?'today-row':''}"><span class="d">${DAY_NAMES[d].slice(0,3)}</span><span class="g">${p.label}</span></li>`;
  }).join('');

  let statsHtml = '', chartHtml = '';
  if(weightLog.length >= 1){
    const startW = bodyweight || weightLog[0].weight;
    const latest = weightLog[weightLog.length-1].weight;
    const lost = roundHalf(startW - latest);
    statsHtml = `
      <div class="weight-stats">
        <div class="wstat"><div class="num">${startW}</div><div class="lbl">Start kg</div></div>
        <div class="wstat"><div class="num">${latest}</div><div class="lbl">Latest kg</div></div>
        <div class="wstat"><div class="num">${lost>=0?'−':'+'}${Math.abs(lost)}</div><div class="lbl">${lost>=0?'Lost':'Gained'}</div></div>
      </div>`;
  }
  if(weightLog.length >= 2){
    const weights = weightLog.map(s=>s.weight);
    const min = Math.min(...weights), max = Math.max(...weights);
    const range = (max-min) || 1;
    const W=640, H=140, PAD=20;
    const stepX = (W-2*PAD)/(weightLog.length-1);
    const points = weightLog.map((s,i)=>{
      const x = PAD + i*stepX;
      const y = H-PAD - ((s.weight-min)/range)*(H-2*PAD);
      return [x,y];
    });
    const path = points.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = points.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#f2f2f0"/>`).join('');
    chartHtml = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:140px;overflow:visible;">
      <path d="${path}" fill="none" stroke="#f2f2f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  } else {
    chartHtml = `<div class="chart-empty">Log your weight for at least 2 weeks to see the trend line.</div>`;
  }

  const todos = (await getVal('todos')) || [];
  const todoHtml = todos.length ? todos.map(t=>`
    <li class="todo-item ${t.done?'done':''}">
      <div class="todo-check" onclick="toggleTodo('${t.id}')">${t.done?'✓':''}</div>
      <div style="flex:1;">
        <div class="todo-label" onclick="toggleTodo('${t.id}')">${escapeHtml(t.text)}</div>
        ${todoMetaHtml(t)}
      </div>
      <button class="todo-del" onclick="deleteTodo('${t.id}')">✕</button>
    </li>`).join('') : `<div class="todo-empty">Nothing on your list yet.</div>`;

  const { streak, totalSessions } = await computeStreakStats(start, todayIdx);
  const badgesHtml = BADGES.map(b=>{
    const unlocked = totalSessions >= b.threshold;
    return `<div class="badge-tile ${unlocked?'unlocked':''}"><div class="badge-icon">${b.icon}</div><div class="badge-label">${b.label}</div></div>`;
  }).join('');

  const favorites = (await getVal('favorites')) || [];
  const exMap = await getAllExercisesById();
  const favHtml = favorites.length ? favorites.map(id=>{
    const ex = exMap[id];
    if(!ex) return '';
    return `<li><div><div class="fname">${ex.name}</div>${ex.cue ? `<div class="fcue">${ex.cue}${CUE_AM[ex.id] ? `<br>🇪🇹 ${CUE_AM[ex.id]}` : ''}</div>` : ''}</div><button class="fav-remove" onclick="toggleFavorite('${id}')">✕</button></li>`;
  }).join('') : `<div class="todo-empty">Star an exercise on any day to pin it here.</div>`;

  return `
    <div class="quote-card">
      <div class="quote-text">${SESSION_QUOTE.text}</div>
      <div class="quote-author">— ${SESSION_QUOTE.author}</div>
    </div>
    <div class="card">
      <div class="section-title">Streak</div>
      <div class="weight-stats">
        <div class="wstat"><div class="num">${streak}</div><div class="lbl">Day Streak</div></div>
        <div class="wstat"><div class="num">${totalSessions}</div><div class="lbl">Total Sessions</div></div>
      </div>
      <div class="badges-grid">${badgesHtml}</div>
    </div>
    <div class="card">
      <div class="section-title">This week's schedule</div>
      <ul class="sched-list">${schedHtml}</ul>
    </div>
    <div class="card">
      <div class="section-title">Weight progress · Week ${week}</div>
      <div class="weight-log-row">
        <input type="number" step="0.1" id="weekweight" placeholder="This week's weight (kg)">
        <button onclick="logWeeklyWeight(${week})">Log</button>
      </div>
      ${statsHtml}
      ${chartHtml}
    </div>
    <div class="card">
      <div class="section-title">Favorites</div>
      <ul class="fav-list">${favHtml}</ul>
    </div>
    <div class="card">
      <div class="section-title">To-do</div>
      <div class="todo-add-extra">
        <input type="time" id="todo-time">
        <input type="text" id="todo-note" placeholder="Explanation / why (optional)">
      </div>
      <div class="todo-add">
        <input type="text" id="todo-input" placeholder="Add a task..." onkeydown="if(event.key==='Enter'){addTodo();}">
        <button onclick="addTodo()">+</button>
      </div>

}

}

async function isPillarDayComplete(pillar, dayIdx){
  const def = PILLARS[pillar];
  const done = await getPillarDayTasks(pillar, dayIdx);
  return def.dailyTasks.every(t => done.includes(t.id));
}

async function computePillarStats(pillar, todayIdx){
  const def = PILLARS[pillar];
  const keys = await listPrefix(`ptask:${pillar}:`);
  const doneIdxs = new Set();
  for(const k of keys){
    const dIdx = parseInt(k.split(':').pop(), 10);
    const rec = (await getVal(k)) || [];
    if(def.dailyTasks.every(t => rec.includes(t.id))) doneIdxs.add(dIdx);
  }
  const totalDays = doneIdxs.size;
  let streak = 0, idx = todayIdx;
  while(idx >= 0){
    if(doneIdxs.has(idx)){ streak++; idx--; }
    else if(idx === todayIdx){ idx--; continue; }
    else break;
  }
  return { streak, totalDays };
}

// ── General (all 4 pillars combined) ──────────────────────────────────────
async function computeAllPillarStats(start, todayIdx){
  const elapsedDays = todayIdx + 1;
  const physical = await computeStreakStats(start, todayIdx);
  const mental = await computePillarStats('mental', todayIdx);
  const financial = await computePillarStats('financial', todayIdx);
  const spiritual = await computePillarStats('spiritual', todayIdx);
  const pct = n => elapsedDays > 0 ? Math.min(100, Math.round((n/elapsedDays)*100)) : 0;
  return {
    physical: { label:'Physical', streak: physical.streak, total: physical.totalSessions, pct: pct(physical.totalSessions) },
    mental: { label:'Mental', streak: mental.streak, total: mental.totalDays, pct: pct(mental.totalDays) },
    financial: { label:'Financial', streak: financial.streak, total: financial.totalDays, pct: pct(financial.totalDays) },
    spiritual: { label:'Spiritual', streak: spiritual.streak, total: spiritual.totalDays, pct: pct(spiritual.totalDays) },
  };
}

async function isPerfectDay(start, idx){
  const date = new Date(start.getTime() + idx*DAY_MS);
  const isRest = dayTypeFor(date) === 0;
  let physicalOk = true;
  if(!isRest){
    const att = await getVal(`attendance:${idx}`);
    physicalOk = !!(att && att.went);
  }
  const mentalOk = await isPillarDayComplete('mental', idx);
  const financialOk = await isPillarDayComplete('financial', idx);
  const spiritualOk = await isPillarDayComplete('spiritual', idx);
  return physicalOk && mentalOk && financialOk && spiritualOk;
}

async function computePerfectDayStats(start, todayIdx){
  let totalPerfect = 0;
  for(let idx=0; idx<=todayIdx; idx++){
    if(await isPerfectDay(start, idx)) totalPerfect++;
  }
  let streak = 0, idx = todayIdx;
  while(idx >= 0){
    if(await isPerfectDay(start, idx)){ streak++; idx--; }
    else if(idx === todayIdx){ idx--; continue; }
    else break;
  }
  return { streak, totalPerfect };
}

function renderGeneralBarChart(stats){
  const order = ['physical','mental','financial','spiritual'];
  const colors = { physical:'#e5e5e5', mental:'#ef4444', financial:'#3b82f6', spiritual:'#22c55e' };
  const W = 300, H = 110, PAD = 20, barW = 34;
  const gap = (W - 2*PAD - order.length*barW) / (order.length-1);
  let bars = '';
  order.forEach((key, i)=>{
    const s = stats[key];
    const barH = Math.max(2, (s.pct/100) * (H-2*PAD));
    const x = PAD + i*(barW+gap);
    const y = H-PAD-barH;
    bars += `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${colors[key]}"/>
      <text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="${colors[key]}" font-family="var(--mono)">${s.pct}%</text>
      <text x="${x+barW/2}" y="${H-PAD+13}" text-anchor="middle" font-size="9" fill="var(--ink-dim)" font-family="var(--mono)">${s.label[0]}</text>
    `;
  });
  const legend = order.map(key => `
    <span class="gen-legend-item">
      <span class="gen-legend-dot" style="background:${colors[key]};"></span>${stats[key].label} · ${stats[key].streak}d
    </span>`).join('');
  return `
    <div class="gen-chart-box">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:110px;overflow:visible;">
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
    <div class="gen-legend">${legend}</div>
  `;
}

async function renderGeneralHeatmap(start, todayIdx){

  let html = '';
  for(let w=0; w<WEEKS; w++){
    html += `<div class="hm-weeklabel">Week ${w+1}</div><div class="hm-grid">`;
    for(let d=0; d<7; d++){
      const idx = w*7+d;
      const isFuture = idx > todayIdx;
      const date = new Date(start.getTime() + idx*DAY_MS);
      const isRest = dayTypeFor(date) === 0;
      let physicalDone = isRest, mentalDone = false, financialDone = false, spiritualDone = false;
      if(!isFuture){
        if(!isRest){ const att = await getVal(`attendance:${idx}`); physicalDone = !!(att && att.went); }
        mentalDone = await isPillarDayComplete('mental', idx);
        financialDone = await isPillarDayComplete('financial', idx);
        spiritualDone = await isPillarDayComplete('spiritual', idx);
      }
      const allDone = !isFuture && physicalDone && mentalDone && financialDone && spiritualDone;
      const dot = (on, color) => `<span class="hm-dot" style="background:${on?color:'transparent'};border-color:${color};"></span>`;
      const dots = dot(!isFuture && physicalDone, dotColor.physical)
        + dot(!isFuture && mentalDone, dotColor.mental)
        + dot(!isFuture && financialDone, dotColor.financial)
        + dot(!isFuture && spiritualDone, dotColor.spiritual);
      const isToday = idx === todayIdx;
      html += `<div class="hm-cell ${isFuture?'future':''} ${allDone?'perfect':''} ${isToday?'today':''}" title="${date.toDateString()}">${dots}</div>`;
    }
    html += `</div>`;
  }
  return html;
}

  for(const pillar of order){

    for(const idx of days){

  if(dismissed) return '';

  const date = new Date(start.getTime() + yIdx*DAY_MS);
  const isRest = dayTypeFor(date) === 0;

  if(!isRest){
    const att = await getVal(`attendance:${yIdx}`);
    if(!(att && att.went)) missed.push({ label:'Physical', jump:`openDay(${yIdx})` });
  }
  for(const p of ['mental','financial','spiritual']){
    const complete = await isPillarDayComplete(p, yIdx);
    if(!complete) missed.push({ label: PILLARS[p].label, jump:`openPillarDay('${p}',${yIdx})` });

  }

    <button class="nudge-dismiss" onclick="dismissNudge(${yIdx})" title="Dismiss">✕</button>

window.quickCheckIn = async function(pillar){
  const start = await getStart();
  const todayIdx = dayIndexFor(start, new Date());

  if(pillar === 'physical'){
    const date = new Date(start.getTime() + todayIdx*DAY_MS);
    if(dayTypeFor(date) === 0){ render(); return; }
    const att = await getVal(`attendance:${todayIdx}`);
    const done = !!(att && att.went);
    await setVal(`attendance:${todayIdx}`, { went: !done, dateISO: new Date().toISOString() });
    if(!done){
      const { streak } = await computeStreakStats(start, todayIdx);
      showToast(`🔥 Physical done! ${streak} day streak.`);
    }
  } else {
    const ids = PILLARS[pillar].dailyTasks.map(t => t.id);
    const done = await getPillarDayTasks(pillar, todayIdx);
    const complete = ids.length > 0 && ids.every(id => done.includes(id));
    if(complete){
      await setVal(`ptask:${pillar}:${todayIdx}`, []);
    } else {
      await setVal(`ptask:${pillar}:${todayIdx}`, ids.slice());
      const { streak } = await computePillarStats(pillar, todayIdx);
      showToast(`🔥 ${PILLARS[pillar].label} done! ${streak} day streak.`);
    }
  }
  render();
};

  let combined = [];
  for(const src of sources){
    const list = (await getVal(src.key)) || [];
    list.forEach(t => combined.push({ ...t, pillar: src.pillar, originLabel: src.label, originColor: src.color }));
  }
  if(!combined.length){
    return `<div class="todo-empty">Nothing on any of your lists yet. Add a task on any dashboard and it'll show up here.</div>`;
  }
  // Timed tasks first (earliest first), then untimed tasks, incomplete before done within each group
  combined.sort((a,b) => {
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time && !b.time) return -1;
    if(!a.time && b.time) return 1;
    return 0;
  });
  return combined.map(t => {
    const toggleCall = t.pillar==='physical' ? `toggleTodo('${t.id}')` : `togglePillarTodo('${t.pillar}','${t.id}')`;
    const deleteCall = t.pillar==='physical' ? `deleteTodo('${t.id}')` : `deletePillarTodo('${t.pillar}','${t.id}')`;
    return `
    <li class="todo-item ${t.done?'done':''}">
      <div class="todo-check" onclick="${toggleCall}" style="${t.done?`background:${t.originColor};border-color:${t.originColor};`:`border-color:${t.originColor};`}">${t.done?'✓':''}</div>
      <div style="flex:1;">
        <div class="todo-label" onclick="${toggleCall}">${escapeHtml(t.text)}</div>
        <div class="todo-meta">
          <span class="todo-origin" style="background:${t.originColor}22;color:${t.originColor};">${t.originLabel}</span>
          ${t.time ? `<span class="todo-time">⏰ ${formatTimeLabel(t.time)}</span>` : ''}
          ${t.note ? `<span class="todo-note">${escapeHtml(t.note)}</span>` : ''}
        </div>
      </div>
      <button class="todo-del" onclick="${deleteCall}">✕</button>
    </li>`;
  }).join('');
}

async function renderPillarCalendar(pillar, start, todayIdx){
  let html = '';
  for(let w=0; w<WEEKS; w++){
    html += `<div class="weeklabel">Week ${w+1}</div><div class="grid">`;
    for(let d=0; d<7; d++){
      const idx = w*7+d;
      const date = new Date(start.getTime() + idx*DAY_MS);
      const isFuture = idx > todayIdx;
      const isToday = idx === todayIdx;
      let mark = '·';
      if(!isFuture){
        const complete = await isPillarDayComplete(pillar, idx);
        if(complete) mark = '✓';
        else if(isToday) mark = '?';
        else mark = '✕';
      }
      html += `<div class="gcell ${isToday?'today':''}" onclick="openPillarDay('${pillar}',${idx})">
        <div class="dlabel">${DAY_NAMES[date.getDay()].slice(0,3)}</div>
        <div class="mark" style="color:${mark==='✓'?'var(--good)':mark==='✕'?'var(--bad)':'var(--ink-dim)'}">${mark}</div>
      </div>`;
    }
    html += `</div>`;
  }
  return html;
}

async function callClaude(system, messages){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: system,
      messages: messages
    })
  });
  if(!response.ok) throw new Error('API request failed: ' + response.status);
  const data = await response.json();
  return (data.content || []).map(b => b.text || '').join('\n').trim();
}

function escapeHtml(str){

  d.textContent = str;
  return d.innerHTML.replace(/\n/g, '<br>');

function formatTimeLabel(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function todoMetaHtml(t){
  if(!t.time && !t.note) return '';
  return `<div class="todo-meta">${t.time ? `<span class="todo-time">⏰ ${formatTimeLabel(t.time)}</span>` : ''}${t.note ? `<span class="todo-note">${escapeHtml(t.note)}</span>` : ''}</div>`;
}

      recent.map(e => `- ${new Date(e.dateISO).toLocaleDateString()}: category="${e.category}", class ${e.violationClass}, rule "${e.rule}"`).join('\n')
    : 'No offenses logged in the last 7 days.';

  const userMsg = `Confession: "${confession}"\n\n${historyNote}`;
  const raw = await callClaude(COURT_SYSTEM, [{ role:'user', content: userMsg }]);
  const cleaned = raw.replace(/^```json\s*|^```\s*|```$/g, '').trim();
  let verdict;
  try{ verdict = JSON.parse(cleaned); }
  catch(e){ verdict = { rule:'Parsing Error', violationClass:1, reasoning:'The court could not parse a ruling. Try rephrasing your confession.', punishment:'N/A', category:'error', exempt:false }; }
  return verdict;
}

window.submitToCourt = async function(){

    resetCourtTimerState();
  }catch(e){
    alert("Couldn't reach the court right now. Try again in a moment.");

  render();
};

// Court punishment timer — counts up from zero, start/pause/reset.
let courtSwElapsedMs = 0;
let courtSwStartTs = null;
let courtSwInterval = null;
function getCourtSwMs(){ return courtSwElapsedMs + (courtSwStartTs ? (Date.now()-courtSwStartTs) : 0); }
function updateCourtTimerDisplay(){
  const el = document.getElementById('court-timer-display');
  if(!el) return;
  const totalSec = Math.floor(getCourtSwMs()/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  el.textContent = h > 0 ? `${padTime(h)}:${padTime(m)}:${padTime(s)}` : `${padTime(m)}:${padTime(s)}`;
}
function resetCourtTimerState(){
  if(courtSwInterval){ clearInterval(courtSwInterval); courtSwInterval=null; }
  courtSwElapsedMs = 0; courtSwStartTs = null;
}
window.courtTimerStart = function(){
  if(courtSwInterval) return;
  courtSwStartTs = Date.now();
  courtSwInterval = setInterval(updateCourtTimerDisplay, 250);
};
window.courtTimerPause = function(){
  if(courtSwInterval){ courtSwElapsedMs = getCourtSwMs(); clearInterval(courtSwInterval); courtSwInterval=null; courtSwStartTs=null; }
};
window.courtTimerReset = function(){
  window.courtTimerPause();
  courtSwElapsedMs = 0; courtSwStartTs = null;
  updateCourtTimerDisplay();
};

window.saveVideoFile = async function(exId, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('video/')){
    alert('That doesn\'t look like a video file — please choose a video.');
    inputEl.value = '';
    return;
  }
  // Uploaded videos are stored as base64 text, which inflates size ~33% — keep comfortably under the storage limit.
  const MAX_BYTES = 4 * 1024 * 1024;
  if(file.size > MAX_BYTES){
    alert(`That video is ${(file.size/1024/1024).toFixed(1)}MB. Uploaded videos need to stay under 4MB — try a shorter clip, compress it, or paste a YouTube/TikTok link instead.`);
    inputEl.value = '';
    return;
  }
  try{
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('read failed'));
      reader.readAsDataURL(file);
    });
    await setVal(`video:${exId}`, dataUrl);
    render();
  }catch(e){
    alert('Could not upload that video. Try a smaller file, or paste a link instead.');
  }
  inputEl.value = '';
};

let currentTimerMode = 'rest';

// Rest countdown — timestamp-based so it can't drift, even if the tab is backgrounded.
let restTotalSeconds = 90;
let restTargetEnd = null;
let restRemainingWhenPaused = restTotalSeconds*1000;
let restInterval = null;

function padTime(n){ return String(n).padStart(2,'0'); }

function getRestRemainingMs(){
  if(restTargetEnd) return Math.max(0, restTargetEnd - Date.now());
  return restRemainingWhenPaused;
}
function updateTimerDisplay(){
  if(currentTimerMode !== 'rest') return;
  const el = document.getElementById('timer-display');
  if(!el) return;
  const totalSec = Math.ceil(getRestRemainingMs()/1000);
  el.textContent = `${padTime(Math.floor(totalSec/60))}:${padTime(totalSec%60)}`;
}
function beepAlert(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.2;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 500);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
window.setRestTimer = function(sec){
  if(restInterval){ clearInterval(restInterval); restInterval=null; }
  restTotalSeconds = sec; restTargetEnd = null; restRemainingWhenPaused = sec*1000;
  updateTimerDisplay();
};
window.startTimer = function(){
  if(restInterval) return;
  restTargetEnd = Date.now() + getRestRemainingMs();
  restRemainingWhenPaused = null;
  restInterval = setInterval(()=>{
    const ms = getRestRemainingMs();
    if(ms <= 0){
      clearInterval(restInterval); restInterval = null; restTargetEnd = null; restRemainingWhenPaused = 0;
      updateTimerDisplay(); beepAlert();
      return;
    }
    updateTimerDisplay();
  }, 250);
};
window.pauseTimer = function(){
  if(restInterval){ restRemainingWhenPaused = getRestRemainingMs(); clearInterval(restInterval); restInterval=null; restTargetEnd=null; }
};
window.resetTimerDisplay = function(){
  window.pauseTimer();
  restRemainingWhenPaused = restTotalSeconds*1000; restTargetEnd = null;
  updateTimerDisplay();
};
window.quickRest = function(sec){
  window.setTimerMode('rest');
  window.setRestTimer(sec);
  window.startTimer();
  const p = document.getElementById('timer-panel');
  if(p) p.classList.add('open');
};

// Stopwatch — also timestamp-based, counts up from zero.
let swElapsedMs = 0;
let swStartTs = null;
let swInterval = null;
function getStopwatchMs(){ return swElapsedMs + (swStartTs ? (Date.now()-swStartTs) : 0); }
function updateStopwatchDisplay(){
  if(currentTimerMode !== 'stopwatch') return;
  const el = document.getElementById('timer-display');
  if(!el) return;
  const totalSec = Math.floor(getStopwatchMs()/1000);
  el.textContent = `${padTime(Math.floor(totalSec/60))}:${padTime(totalSec%60)}`;
}
window.stopwatchStart = function(){
  if(swInterval) return;
  swStartTs = Date.now();
  swInterval = setInterval(updateStopwatchDisplay, 250);
};
window.stopwatchPause = function(){
  if(swInterval){ swElapsedMs = getStopwatchMs(); clearInterval(swInterval); swInterval=null; swStartTs=null; }
};
window.stopwatchReset = function(){
  window.stopwatchPause();
  swElapsedMs = 0; swStartTs = null;
  updateStopwatchDisplay();
};

window.setTimerMode = function(mode){
  currentTimerMode = mode;
  const rTab = document.getElementById('tmode-rest'), sTab = document.getElementById('tmode-stopwatch');
  const rCtrl = document.getElementById('rest-controls'), sCtrl = document.getElementById('stopwatch-controls');
  if(rTab) rTab.classList.toggle('active', mode==='rest');
  if(sTab) sTab.classList.toggle('active', mode==='stopwatch');
  if(rCtrl) rCtrl.style.display = mode==='rest' ? 'block' : 'none';
  if(sCtrl) sCtrl.style.display = mode==='stopwatch' ? 'block' : 'none';
  if(mode==='rest') updateTimerDisplay(); else updateStopwatchDisplay();
};
window.toggleTimerPanel = function(){ const p = document.getElementById('timer-panel'); if(p) p.classList.toggle('open'); };
updateTimerDisplay();

// ── Onboarding — ask about the person before they enter, create a profile ─
function showOnboardingModal(existing){
  const p = existing || {};
  const existingGoals = Array.isArray(p.goal) ? p.goal : (p.goal ? [p.goal] : []);
  const overlay = document.createElement('div');
  overlay.id = 'onboarding-overlay';
  overlay.className = 'onboarding-overlay';
  overlay.innerHTML = `
    <div class="onboarding-card">
      <h2>${existing ? 'Edit Profile' : 'Welcome 👋'}</h2>
      <p>${existing ? 'Update your details below.' : "Quick intro before you start — this creates your profile at the bottom of the log book."}</p>
      <div class="ob-field"><label>Name</label><input id="ob-name" type="text" placeholder="Your name" value="${p.name ? escapeHtml(p.name) : ''}"></div>
      <div class="ob-row">
        <div class="ob-field"><label>Age</label><input id="ob-age" type="number" placeholder="e.g. 28" value="${p.age ?? ''}"></div>
        <div class="ob-field"><label>Gender</label>
          <select id="ob-gender">
            <option value="male" ${p.gender==='male'?'selected':''}>Male</option>
            <option value="female" ${p.gender==='female'?'selected':''}>Female</option>
          </select>
        </div>
      </div>
      <div class="ob-row">
        <div class="ob-field"><label>Height (cm)</label><input id="ob-height" type="number" placeholder="e.g. 175" value="${p.height ?? ''}"></div>
        <div class="ob-field"><label>Weight (kg)</label><input id="ob-weight" type="number" placeholder="e.g. 72" value="${p.weight ?? ''}"></div>
      </div>
      <div class="ob-field"><label>Main goal (pick one or more)</label>
        <div class="ob-checks" id="ob-goal-group">
          ${Object.entries(GOAL_LABELS).map(([k,label]) =>
            `<label class="ob-check"><input type="checkbox" value="${k}" ${existingGoals.includes(k)?'checked':''}> ${label}</label>`).join('')}
        </div>
      </div>
      <div class="ob-field"><label>Experience level</label>
        <select id="ob-level">
          <option value="beginner" ${(!p.level||p.level==='beginner')?'selected':''}>Beginner</option>
          <option value="intermediate" ${p.level==='intermediate'?'selected':''}>Intermediate</option>
          <option value="advanced" ${p.level==='advanced'?'selected':''}>Advanced</option>
        </select>
      </div>
      <button class="ob-submit" onclick="submitOnboarding()">${existing ? 'Save changes' : 'Create my profile'}</button>
      <div class="ob-note">Only your name is required — everything else helps personalize the log book.</div>
    </div>
  `;
  document.body.appendChild(overlay);
}

window.submitOnboarding = async function(){
  const name = document.getElementById('ob-name').value.trim();
  if(!name){ alert('Please enter your name'); return; }
  const age = parseInt(document.getElementById('ob-age').value, 10) || null;
  const gender = document.getElementById('ob-gender').value;
  if(!gender){ alert('Please select a gender'); return; }
  const height = parseFloat(document.getElementById('ob-height').value) || null;
  const weight = parseFloat(document.getElementById('ob-weight').value) || null;
  const goal = Array.from(document.querySelectorAll('#ob-goal-group input:checked')).map(cb => cb.value);
  if(goal.length === 0){ alert('Please select at least one main goal'); return; }
  const level = document.getElementById('ob-level').value;

  const existingProfile = await getMyProfile();
  const isEdit = !!existingProfile;
  const profile = {
    name, age, gender, height, weight, goal, level,
    joinedAt: isEdit ? existingProfile.joinedAt : Date.now()
  };
  await setVal('profile:me', profile);

  if(!isEdit){
    const id = await ensureUserId();
    await setShared('member:'+id, { name, joinedAt: profile.joinedAt });
  }

  const overlay = document.getElementById('onboarding-overlay');
  if(overlay) overlay.remove();

  if(!isEdit){
    welcomeBackInfo = await prepareWelcomeBack(profile);
  }
  render();
};

window.editProfile = async function(){
  const existing = await getMyProfile();
  showOnboardingModal(existing);
};

// ── Fresh-start migration ───────────────────────────────────────────────
// Bumping DATA_VERSION wipes any previously logged data on next load so
// the app always boots clean after a content/structure update.
const DATA_VERSION = 'v2-2026-07-08';
async function bootstrap(){
  const seenVersion = await getVal('app:dataVersion');
  if(seenVersion !== DATA_VERSION){
    const keys = await listPrefix('');
    for(const k of keys){ await deleteVal(k); }
    await setVal('app:dataVersion', DATA_VERSION);
  }

  await ensureUserId();
  const profile = await getMyProfile();
  if(!profile){
    showOnboardingModal();
    return; // render() happens once submitOnboarding() runs
  }

  welcomeBackInfo = await prepareWelcomeBack(profile);
  render();
}
bootstrap();
